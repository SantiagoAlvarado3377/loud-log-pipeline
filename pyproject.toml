[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-log-pipeline"
version = "0.1.0"
description = "Cloud-native log ingestion pipeline using SQS, Lambda, S3, DynamoDB, and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3==1.35.99",
  "fastapi==0.115.13",
  "python-dotenv==1.0.1",
  "uvicorn==0.30.6",
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.2",
  "moto==5.0.14",
  "pytest==8.3.2",
]

[tool.setuptools.packages.find]
include = ["api*", "producer*", "processor*", "cloud_log_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
